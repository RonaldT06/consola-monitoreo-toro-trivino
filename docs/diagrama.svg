<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0b0b0b">Cómo encaja todo: equipos → NetMon (Docker) → tablero y Telegram</text>
  <text x="30" y="64" font-size="14" fill="#52514e">NetMon pregunta a los equipos por SNMP cada 10 s y además escucha los avisos (traps) que ellos envían.</text>

  <!-- Equipos -->
  <rect x="30" y="100" width="230" height="400" rx="12" fill="#f4f4f2" stroke="#c9c8c2"/>
  <text x="145" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Equipos del laboratorio</text>
  <text x="145" y="147" font-size="12" text-anchor="middle" fill="#52514e">red de gestión 192.168.100.0/24</text>
  <g>
    <rect x="50" y="165" width="190" height="78" rx="10" fill="#fff" stroke="#9a9994"/>
    <text x="145" y="194" font-size="15" font-weight="600" text-anchor="middle" fill="#0b0b0b">FortiGate</text>
    <text x="145" y="214" font-size="12.5" text-anchor="middle" fill="#52514e">Firewall · 192.168.100.1</text>
    <text x="145" y="231" font-size="11.5" text-anchor="middle" fill="#7a7974">MIB Fortinet: CPU, RAM, sesiones</text>
  </g>
  <g>
    <rect x="50" y="263" width="190" height="78" rx="10" fill="#fff" stroke="#9a9994"/>
    <text x="145" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#0b0b0b">Switch Huawei</text>
    <text x="145" y="312" font-size="12.5" text-anchor="middle" fill="#52514e">Switch · 192.168.100.2</text>
    <text x="145" y="329" font-size="11.5" text-anchor="middle" fill="#7a7974">MIB Huawei: CPU, RAM, temp.</text>
  </g>
  <g>
    <rect x="50" y="361" width="190" height="78" rx="10" fill="#fff" stroke="#9a9994"/>
    <text x="145" y="390" font-size="15" font-weight="600" text-anchor="middle" fill="#0b0b0b">Router Huawei</text>
    <text x="145" y="410" font-size="12.5" text-anchor="middle" fill="#52514e">Router · 192.168.100.3</text>
    <text x="145" y="427" font-size="11.5" text-anchor="middle" fill="#7a7974">IF-MIB: estado de interfaces</text>
  </g>
  <text x="145" y="470" font-size="11.5" text-anchor="middle" fill="#52514e">SNMP v2c · community en .env</text>

  <!-- Docker -->
  <rect x="380" y="100" width="380" height="400" rx="12" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="570" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#0b0b0b">Contenedor Docker «netmon» (PC 192.168.100.10)</text>
  <text x="570" y="147" font-size="12" text-anchor="middle" fill="#52514e">docker compose up -d · lee config.yaml y .env</text>

  <rect x="405" y="165" width="160" height="70" rx="10" fill="#fff" stroke="#2a78d6"/>
  <text x="485" y="194" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Sondeo SNMP</text>
  <text x="485" y="213" font-size="11.5" text-anchor="middle" fill="#52514e">GET/WALK cada 10 s + ping</text>

  <rect x="405" y="263" width="160" height="70" rx="10" fill="#fff" stroke="#eb6834"/>
  <text x="485" y="292" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Receptor de traps</text>
  <text x="485" y="311" font-size="11.5" text-anchor="middle" fill="#52514e">UDP 162 · linkDown, etc.</text>

  <rect x="585" y="210" width="155" height="80" rx="10" fill="#fff" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="662" y="240" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">Motor de alertas</text>
  <text x="662" y="259" font-size="11.5" text-anchor="middle" fill="#52514e">caídas, interfaces,</text>
  <text x="662" y="274" font-size="11.5" text-anchor="middle" fill="#52514e">CPU/RAM, reinicios</text>

  <rect x="405" y="361" width="160" height="70" rx="10" fill="#fff" stroke="#9a9994"/>
  <text x="485" y="390" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Historial SQLite</text>
  <text x="485" y="409" font-size="11.5" text-anchor="middle" fill="#52514e">volumen netmon-data</text>

  <rect x="585" y="361" width="155" height="70" rx="10" fill="#fff" stroke="#9a9994"/>
  <text x="662" y="390" font-size="14" font-weight="600" text-anchor="middle" fill="#0b0b0b">Web FastAPI</text>
  <text x="662" y="409" font-size="11.5" text-anchor="middle" fill="#52514e">API + WebSocket :8090</text>

  <!-- Salidas -->
  <rect x="860" y="150" width="210" height="110" rx="12" fill="#fff" stroke="#9a9994"/>
  <text x="965" y="182" font-size="15" font-weight="600" text-anchor="middle" fill="#0b0b0b">Telegram</text>
  <text x="965" y="203" font-size="12.5" text-anchor="middle" fill="#52514e">bot · api.telegram.org</text>
  <text x="965" y="222" font-size="11.5" text-anchor="middle" fill="#7a7974">alerta al celular en segundos</text>
  <text x="965" y="240" font-size="11.5" text-anchor="middle" fill="#7a7974">comandos /estado /alertas</text>

  <rect x="860" y="320" width="210" height="110" rx="12" fill="#fff" stroke="#9a9994"/>
  <text x="965" y="352" font-size="15" font-weight="600" text-anchor="middle" fill="#0b0b0b">Tablero web</text>
  <text x="965" y="373" font-size="12.5" text-anchor="middle" fill="#52514e">http://localhost:8090</text>
  <text x="965" y="392" font-size="11.5" text-anchor="middle" fill="#7a7974">verde = en línea · rojo = caído</text>
  <text x="965" y="410" font-size="11.5" text-anchor="middle" fill="#7a7974">se actualiza en tiempo real</text>

  <!-- Flechas -->
  <g fill="none" stroke-width="1.6">
    <path d="M260 200 H 400" stroke="#2a78d6" marker-end="url(#c)" marker-start="url(#c)"/>
    <path d="M260 302 C 320 302, 340 298, 400 298" stroke="#eb6834" marker-end="url(#b)"/>
    <path d="M565 200 H 575 V 235 H 580" stroke="#52514e" marker-end="url(#a)"/>
    <path d="M565 298 H 575 V 265 H 580" stroke="#52514e" marker-end="url(#a)"/>
    <path d="M620 290 V 344 H 485 V 355" stroke="#52514e" marker-end="url(#a)"/>
    <path d="M662 290 V 355" stroke="#52514e" marker-end="url(#a)"/>
    <path d="M740 396 H 800 V 375 H 855" stroke="#52514e" marker-end="url(#a)"/>
    <path d="M740 250 H 800 V 205 H 855" stroke="#52514e" marker-end="url(#a)"/>
  </g>
  <text x="330" y="190" font-size="11.5" text-anchor="middle" fill="#2a78d6">consultas UDP 161</text>
  <text x="330" y="322" font-size="11.5" text-anchor="middle" fill="#eb6834">traps UDP 162</text>
  <text x="768" y="366" font-size="11.5" fill="#52514e">WebSocket</text>
  <text x="768" y="196" font-size="11.5" fill="#52514e">HTTPS</text>
  <text x="30" y="535" font-size="12" fill="#7a7974">El token del bot y las communities SNMP viven en .env (excluido por .gitignore); config.yaml solo tiene IPs y umbrales.</text>
</svg>
